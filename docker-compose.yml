version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: procureagent_postgres
    environment:
      POSTGRES_USER: procure_user
      POSTGRES_PASSWORD: procure_password
      POSTGRES_DB: procureagent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procure_user -d procureagent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: procureagent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: procureagent_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: procureagent_phoenix
    ports:
      - "6006:6006" # Phoenix UI
      - "4317:4317" # OTEL gRPC Collector

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
